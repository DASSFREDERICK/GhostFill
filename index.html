<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ghostfill Vault</title>
  <style>
    :root {
      --bg: #0c0f14;
      --surface: #12161d;
      --surface-2: #191f28;
      --border: #232b36;
      --text-main: #edf0f3;
      --text-muted: #7c8595;
      --accent: #c9a06a;
      --accent-strong: #e2bc85;
      --accent-dim: rgba(201, 160, 106, 0.14);
      --danger: #d97862;
      --danger-dim: rgba(217, 120, 98, 0.12);
      --success: #6ab09c;
      --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    /* Subtle popup entrance animation */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body {
      width: 300px;
      padding: 0;
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text-main);
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
    }

    /* Subtle breathing glow animation for the dial logo */
    @keyframes pulseGlow {
      0% { opacity: 0.85; filter: drop-shadow(0 0 1px rgba(201, 160, 106, 0.2)); }
      50% { opacity: 1; filter: drop-shadow(0 0 5px rgba(201, 160, 106, 0.4)); }
      100% { opacity: 0.85; filter: drop-shadow(0 0 1px rgba(201, 160, 106, 0.2)); }
    }

    .dial {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .dial circle { fill: none; stroke: var(--accent); }
    .dial circle:nth-child(1) { stroke-width: 1.4; opacity: 0.9; }
    .dial circle:nth-child(2) { stroke-width: 1.4; opacity: 0.45; }
    .dial line { stroke: var(--accent-strong); stroke-width: 1.6; stroke-linecap: round; }

    .header-text h2 {
      font-family: var(--mono);
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0;
      color: var(--text-main);
    }

    .header-text .status {
      font-size: 10.5px;
      color: var(--accent-strong);
      margin-top: 1px;
    }

    /* ---------- Fields ---------- */
    .field-row {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s ease;
    }

    .field-row:hover {
      background: rgba(25, 31, 40, 0.4);
    }

    .field-row label {
      display: block;
      font-size: 10.5px;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .field-row:focus-within label {
      color: var(--accent-strong);
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 7px 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--text-main);
      font-size: 13px;
      font-family: var(--sans);
      transition: all 0.2s ease;
    }

    .field-row input:focus {
      outline: none;
      border-color: var(--accent);
    }

    input::placeholder { color: #4a5261; transition: color 0.15s ease; }
    input:focus::placeholder { color: #646e82; }

    /* ---------- Buttons ---------- */
    .actions {
      padding: 16px 18px 18px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--sans);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #fillBtn {
      background: var(--accent);
      color: #171208;
    }
    #fillBtn:hover { 
      background: var(--accent-strong);
      box-shadow: 0 4px 12px rgba(201, 160, 106, 0.25);
    }

    #clearBtn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      margin-top: 8px;
    }
    #clearBtn:hover {
      background: var(--danger-dim);
      color: var(--danger);
      border-color: rgba(217, 120, 98, 0.35);
    }

    button:active { transform: scale(0.97); }

    /* ---------- Footer ---------- */
    .footer {
      text-align: center;
      font-size: 10px;
      color: #4a5261;
      padding: 10px 18px 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <svg class="dial" viewBox="0 0 26 26">
      <circle cx="13" cy="13" r="11"></circle>
      <circle cx="13" cy="13" r="6.5"></circle>
      <line x1="13" y1="13" x2="13" y2="4"></line>
    </svg>
    <div class="header-text">
      <h2>Ghostfill</h2>
      <div class="status">Local Vault</div>
    </div>
  </div>

  <!-- MAIN VAULT DASHBOARD -->
  <div id="vaultScreen">
    <div class="field-row">
      <label>Full name</label>
      <input type="text" id="fullName" placeholder="John Doe">
    </div>

    <div class="field-row">
      <label>Email address</label>
      <input type="email" id="email" placeholder="john@example.com">
    </div>

    <div class="field-row">
      <label>Phone number</label>
      <input type="text" id="phone" placeholder="+1234567890">
    </div>

    <div class="field-row">
      <label>Address</label>
      <input type="text" id="address" placeholder="123 Main St, City">
    </div>

    <div class="field-row" style="border-bottom: none;">
      <label>Company / university</label>
      <input type="text" id="company" placeholder="Acme Corp">
    </div>

    <div class="actions">
      <button id="fillBtn">Fill this page</button>
      <button id="clearBtn">Clear vault</button>
    </div>
  </div>

  <div class="footer">
    Zero-knowledge · 100% Local Storage
  </div>

  <script src="popup.js"></script>
</body>
</html>
